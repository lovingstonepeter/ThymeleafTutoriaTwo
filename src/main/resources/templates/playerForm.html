<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Player Form</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<h1>Add Player Form</h1>

<div class="container">
    <div class="inside">

        <form th:action="@{/players/addPlayer}"
              th:object="${player}"
              method="post">

            <!-- ID is generated by the database.
                 Keep it hidden for edit operations. -->
            <input type="hidden" th:field="*{id}">

            <label for="name">Name:</label>
            <input type="text" id="name"
                   th:field="*{name}"
                   required>

            <label for="jersey">Jersey:</label>
            <input type="text" id="jersey"
                   th:field="*{jersey}"
                   required>

            <button type="submit"
                    class="submit-button"
                    th:text="${player.id != null} ? 'Edit Player' : 'Add Player'">
                Add Player
            </button>

        </form>

        <a th:href="@{/players}"
           class="back-button">
            ← Back to Players
        </a>

    </div>
</div>

</body>
</html>
