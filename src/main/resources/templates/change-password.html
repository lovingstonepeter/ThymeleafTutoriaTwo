<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>


    <!--
        Defines the character encoding used by the page.

        UTF-8 allows the browser to correctly display normal
        text and special characters.
    -->
    <meta charset="UTF-8">


    <!--
        ============================================================
        CSS STYLESHEET
        ============================================================

        Connect our existing CSS file.

        @{} is Thymeleaf's URL expression syntax.

        Therefore:

            @{/css/style.css}

        becomes the correct URL for our application's
        static CSS file.
    -->
    <link rel="stylesheet" th:href="@{/css/style.css}">


    <!--
        ============================================================
        JAVASCRIPT
        ============================================================

        Load our password-toggle JavaScript file.

        The file contains:

            togglePassword(inputId)

        We will use the same function for:

            1. Current password
            2. New password
            3. Confirm password
    -->
    <script th:src="@{/js/password-toggle.js}"></script>


    <!--
        The title displayed in the browser tab.
    -->
    <title>Change Password</title>


</head>

<body>

<div class="container">

    ```
    <!--
        ============================================================
        PAGE HEADING
        ============================================================

        Main heading of the page.
    -->
    <h1>Change Password</h1>


    <!--
        ============================================================
        ERROR MESSAGE
        ============================================================

        Our ChangePasswordController can add an attribute called:

            error

        when something goes wrong.

        For example:

            - Current password is incorrect.
            - New passwords do not match.

        ${error}

        reads that value from the Thymeleaf model.

        th:if="${error}"

        means:

            "Only display this paragraph if an error exists."
    -->
    <p th:if="${error}"
       th:text="${error}"
       style="color: #ff6b6b;">

        Error message

    </p>


    <!--
        ============================================================
        SUCCESS MESSAGE
        ============================================================

        After successfully changing the password, our controller
        adds:

            success

        to the model.

        This paragraph is displayed only when that value exists.
    -->
    <p th:if="${success}"
       th:text="${success}"
       style="color: #90ee90;">

        Password changed successfully.

    </p>


    <div class="form-container">


        <!--
            ========================================================
            CHANGE PASSWORD FORM
            ========================================================

            The form submits to:

                POST /change-password

            This request is handled by:

                ChangePasswordController

            The controller receives the submitted values through:

                ChangePasswordRequestDTO
        -->
        <form th:action="@{/change-password}"
              th:object="${changePasswordRequest}"
              method="post">


            <!--
                ====================================================
                CURRENT PASSWORD
                ====================================================

                The Treasurer must enter the password currently
                being used to log in.

                The controller checks this password against the
                stored BCrypt password.
            -->
            <div class="form-group">

                <label for="currentPassword">
                    Current Password:
                </label>


                <!--
                    =================================================
                    PASSWORD CONTAINER
                    =================================================

                    This container places the password input and
                    Show/Hide button together.

                    Our CSS class:

                        password-container

                    controls the layout.
                -->
                <div class="password-container">


                    <!--
                        =================================================
                        CURRENT PASSWORD INPUT
                        =================================================

                        type="password"

                        hides the characters entered by the user.

                        th:field="*{currentPassword}"

                        connects this input to:

                            currentPassword

                        inside:

                            ChangePasswordRequestDTO

                        id="currentPassword"

                        gives JavaScript a way to identify this
                        specific input.
                    -->
                    <input type="password"
                           id="currentPassword"
                           th:field="*{currentPassword}"
                           placeholder="Enter current password"
                           required>


                    <!--
                        =================================================
                        SHOW / HIDE BUTTON
                        =================================================

                        type="button"

                        is important.

                        This button should NOT submit the form.

                        It only changes the visibility of the
                        password.

                        onclick:

                            togglePassword('currentPassword')

                        tells JavaScript to control the input whose
                        ID is:

                            currentPassword
                    -->
                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('currentPassword')">

                        Show/Hide

                    </button>

                </div>

            </div>


            <!--
                ====================================================
                NEW PASSWORD
                ====================================================

                This is the new password the Treasurer wants to use.
            -->
            <div class="form-group">

                <label for="newPassword">
                    New Password:
                </label>


                <!--
                    Password input and Show/Hide button are grouped
                    together.
                -->
                <div class="password-container">


                    <!--
                        =================================================
                        NEW PASSWORD INPUT
                        =================================================

                        th:field="*{newPassword}"

                        connects this input to:

                            newPassword

                        inside ChangePasswordRequestDTO.

                        JavaScript identifies this field using:

                            id="newPassword"
                    -->
                    <input type="password"
                           id="newPassword"
                           th:field="*{newPassword}"
                           placeholder="Enter new password"
                           required>


                    <!--
                        Show/Hide button for the new password.

                        type="button"

                        prevents the button from submitting the form.

                        JavaScript receives:

                            newPassword

                        so it knows which input to change.
                    -->
                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('newPassword')">

                        Show/Hide

                    </button>

                </div>

            </div>


            <!--
                ====================================================
                CONFIRM NEW PASSWORD
                ====================================================

                The Treasurer enters the new password again.

                The controller compares:

                    newPassword

                with:

                    confirmPassword

                If they are different, the password is NOT changed.
            -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password:
                </label>


                <!--
                    =================================================
                    PASSWORD CONTAINER
                    =================================================

                    Groups the confirmation password input and its
                    Show/Hide button.
                -->
                <div class="password-container">


                    <!--
                        =================================================
                        CONFIRM PASSWORD INPUT
                        =================================================

                        th:field="*{confirmPassword}"

                        connects this input to:

                            confirmPassword

                        inside ChangePasswordRequestDTO.

                        JavaScript identifies this input using:

                            id="confirmPassword"
                    -->
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           placeholder="Confirm new password"
                           required>


                    <!--
                        Show/Hide button for the confirmation password.

                        JavaScript receives:

                            confirmPassword

                        and changes only this password field.
                    -->
                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword')">

                        Show/Hide

                    </button>

                </div>

            </div>


            <!--
                ====================================================
                CHANGE PASSWORD BUTTON
                ====================================================

                This button DOES submit the form.

                Therefore:

                    type="submit"

                is correct.

                Clicking it sends:

                    POST /change-password

                to our ChangePasswordController.
            -->
            <button type="submit"
                    class="submit-button">

                Change Password

            </button>


        </form>


        <!--
            ========================================================
            BACK BUTTON
            ========================================================

            This is an ordinary link.

            It takes the Treasurer back to the contributors list.
        -->
        <a th:href="@{/dashboard}" class="dashboard-back-button">
            ← Go back to Dashboard
        </a>


    </div>


</div>

</body>
</html>
